<div class="portfolio-selector" [class.is-open]="isOpen">
  <button
    type="button"
    class="selector-trigger"
    (click)="toggle()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen"
    [disabled]="loading() || hasError()"
  >
    <span class="selector-label selector-label--placeholder" [title]="selectedLabel()">
      {{ loading() ? 'Caricamento portafogli…' : hasError() ? 'Portafogli non disponibili' : selectedLabel() }}
    </span>
    <span class="material-symbols-rounded selector-chevron" *ngIf="!loading() && !hasError()">{{ isOpen ? 'expand_less' : 'expand_more' }}</span>
  </button>

  <div class="selector-menu" role="listbox" *ngIf="isOpen && !loading() && !hasError()">
    <button
      type="button"
      class="selector-option selector-option--placeholder"
      role="option"
      [attr.aria-selected]="visibleSelectedPortfolio() === null"
      [class.is-selected]="visibleSelectedPortfolio() === null"
      (click)="selectPortfolio(null)"
    >
      <span class="selector-option__check material-symbols-rounded" aria-hidden="true">
        {{ visibleSelectedPortfolio() === null ? 'check' : '' }}
      </span>
      <span class="selector-option__label selector-option__label--placeholder" [title]="triggerPlaceholder">{{ triggerPlaceholder }}</span>
    </button>

    <ng-container *ngIf="effectiveMode() !== 'laboratorio'">
    <ng-container *ngFor="let option of realOptions()">
      <button type="button" class="selector-option" role="option"
        [attr.aria-selected]="visibleSelectedPortfolio()?.id === option.id"
        [class.is-selected]="visibleSelectedPortfolio()?.id === option.id"
        (click)="selectPortfolio(option.id)">
        <span class="selector-option__icon material-symbols-rounded" [ngClass]="option.tipo === 'reale' ? 'selector-option__icon--real' : 'selector-option__icon--laboratory'" aria-hidden="true">{{ option.tipo === 'reale' ? 'folder' : 'science' }}</span>
        <span class="selector-option__label" [title]="option.label">{{ option.label }}</span>
      </button>
    </ng-container>
    </ng-container>

    <div *ngIf="effectiveMode() === 'all' && realOptions().length > 0 && laboratoryOptions().length > 0"
      class="selector-section-divider" role="separator" aria-hidden="true"></div>

    <ng-container *ngIf="effectiveMode() !== 'reale'">
    <ng-container *ngFor="let option of laboratoryOptions()">
      <button type="button" class="selector-option" role="option"
        [attr.aria-selected]="visibleSelectedPortfolio()?.id === option.id"
        [class.is-selected]="visibleSelectedPortfolio()?.id === option.id"
        (click)="selectPortfolio(option.id)">
        <span class="selector-option__icon material-symbols-rounded" [ngClass]="option.tipo === 'reale' ? 'selector-option__icon--real' : 'selector-option__icon--laboratory'" aria-hidden="true">{{ option.tipo === 'reale' ? 'folder' : 'science' }}</span>
        <span class="selector-option__label" [title]="option.label">{{ option.label }}</span>
      </button>
    </ng-container>
    </ng-container>

  </div>
</div>
