<div class="app-shell">
  <header class="global-navbar" aria-label="Navigazione principale">
    <div class="brand-group" aria-label="ETFolio brand">
      <div class="brand-copy">
        <span class="brand-name">ETFolio</span>
        <span class="brand-tag">COSTRUISCI • ANALIZZA • MIGLIORA</span>
      </div>
    </div>

    <nav class="nav-links" aria-label="Menu principale">
      <a routerLink="/home" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="goHome($event)">Home</a>
      <app-portfolio-selector></app-portfolio-selector>
      <button type="button" class="nav-cta">
        <span class="material-symbols-rounded">add</span>
        <span>Nuovo ETF</span>
      </button>
    </nav>

    <div class="nav-actions" aria-label="Profilo">
      <div class="profile-menu">
        <button type="button" class="avatar-button" aria-label="Profilo utente" aria-haspopup="menu" [attr.aria-expanded]="profileMenuOpen" (click)="toggleProfileMenu($event)">
          <span>{{ loggedUsername }}</span>
        </button>
        <div class="profile-dropdown" [class.is-open]="profileMenuOpen" role="menu" [attr.aria-hidden]="!profileMenuOpen" (click)="$event.stopPropagation()">
          <button type="button" class="profile-dropdown__item" role="menuitem" [disabled]="isRegeneratingMarketUniverse" (click)="regenerateMarketUniverse($event)">
            <span class="material-symbols-rounded">autorenew</span>
            <span>{{ isRegeneratingMarketUniverse ? 'Generazione in corso…' : 'Genera Market Universe' }}</span>
          </button>
          <div class="profile-dropdown__separator" aria-hidden="true"></div>
          <button type="button" class="profile-dropdown__item profile-dropdown__item--logout" role="menuitem" (click)="logout($event)">
            <span class="material-symbols-rounded">logout</span>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="route-content" [class.route-content--feature]="showFeatureSidebar">
    <div *ngIf="showFeatureSidebar" class="app-feature-action-row">
      <button *ngIf="featureActionLabel" type="button" class="app-feature-action" [class.is-running]="featureActionRunning" [disabled]="featureActionDisabled" (click)="runFeatureAction()">
        <span class="app-feature-action__fill" [style.width.%]="featureActionProgress"></span>
        <span class="app-feature-action__content"><span class="material-symbols-rounded">{{ featureActionIcon }}</span><span>{{ featureActionLabel }}</span></span>
      </button>
      <button *ngIf="secondaryFeatureActionLabel" type="button" class="app-feature-action app-feature-action--secondary" [class.is-running]="secondaryFeatureActionRunning" [disabled]="secondaryFeatureActionDisabled" (click)="runSecondaryFeatureAction()">
        <span class="app-feature-action__content"><span class="material-symbols-rounded">{{ secondaryFeatureActionIcon }}</span><span>{{ secondaryFeatureActionLabel }}</span></span>
      </button>
    </div>
    <aside *ngIf="showFeatureSidebar" class="app-feature-sidebar" aria-label="Navigazione ETFolio">
      <a class="app-feature-menu-card app-feature-menu-card--blue" routerLink="/laboratorio-portafogli" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">science</span><span>Laboratorio Portafogli</span></a>
      <a class="app-feature-menu-card app-feature-menu-card--purple" routerLink="/portafogli" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">folder</span><span>I miei Portafogli</span></a>
      <a class="app-feature-menu-card app-feature-menu-card--green" routerLink="/monte-carlo" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">trending_up</span><span>Monte Carlo</span></a>
      <a class="app-feature-menu-card app-feature-menu-card--amber" routerLink="/ribilanciamento" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">sync</span><span>Ribilanciamento</span></a>
      <a class="app-feature-menu-card app-feature-menu-card--cyan" routerLink="/market-universe" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">bar_chart</span><span>ETF & Mercati</span></a>
      <a class="app-feature-menu-card app-feature-menu-card--blue" routerLink="/nuovo-etf" routerLinkActive="is-active"><span class="app-feature-menu-icon material-symbols-rounded">add</span><span>Nuovo ETF</span></a>
    </aside>
    <section class="route-page"><router-outlet (activate)="onFeatureActivate($event)"></router-outlet></section>
  </main>
</div>
