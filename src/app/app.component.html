<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-block brand-block--logo">
      <img src="assets/img/Logo_investment_lab_x.png" alt="Investment Lab X" class="brand-logo" />
    </div>

    <nav class="nav-main">
      <button
        *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="activePage() === item.id"
        type="button"
        (click)="selectPage(item.id)"
      >
        <span class="icon material-symbols-rounded">{{ item.icon }}</span>
        <span class="copy">
          <strong>{{ item.label }}</strong>
          <small>{{ item.description }}</small>
        </span>
      </button>
    </nav>


    <div class="sidebar-footer">
      <p>Frontend ready for REST APIs</p>
      <span>Live data layer next</span>
    </div>
  </aside>

  <main class="content-area">
    <header class="topbar">
      <div class="eyebrow">Portfolio Simulator / {{ activeLabel() }}</div>
      <h2>{{ activeLabel() }}</h2>
    </header>

    <section class="content-card" [class.content-card-portafogli]="activePage() === 'portafogli'">
      <app-portafogli-page *ngIf="activePage() === 'portafogli'"></app-portafogli-page>
      <app-quotazioni-page *ngIf="activePage() === 'quotazioni'"></app-quotazioni-page>
      <app-correlations-page *ngIf="activePage() === 'correlations'"></app-correlations-page>
      <app-montecarlo-new-page *ngIf="activePage() === 'montecarlo'"></app-montecarlo-new-page>
      <app-montecarlo-validation-page *ngIf="activePage() === 'montecarlo-validation'"></app-montecarlo-validation-page>
      <app-backtesting-page *ngIf="activePage() === 'backtesting'"></app-backtesting-page>
      <app-new-etf-page *ngIf="activePage() === 'new-etf'"></app-new-etf-page>
      <app-settings-page *ngIf="activePage() === 'settings'"></app-settings-page>
    </section>
  </main>
</div>
